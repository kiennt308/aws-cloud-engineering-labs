AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  OrderFlow CloudWatch Logs Transaction Search (aws/spans) with KMS
  encryption, MetricFilters, and CloudWatch Alarms for HTTP 5xx spikes
  and checkout p95 latency regressions.

Metadata:
  OrderFlowAccount: orderflow-prod
  Author: Kien Nguyen
  License: Apache-2.0

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Target OrderFlow runtime environment.

  IndexingPercentage:
    Type: Number
    Default: 100
    MinValue: 0
    MaxValue: 100
    Description: Percentage of OTLP spans indexed in Transaction Search.

  CheckoutP95ThresholdMs:
    Type: Number
    Default: 450
    MinValue: 50
    Description: Checkout p95 latency threshold in milliseconds.

  Error5xxThreshold:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Maximum tolerated HTTP 5xx span errors per minute.

Resources:
  TelemetryKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: >-
        OrderFlow KMS CMK for aws/spans LogGroup and alert SNS topic.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${Part}:iam::${Acct}:root"
                - Part: !Ref AWS::Partition
                  Acct: !Ref AWS::AccountId
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub
                  - "arn:${Part}:logs:${Reg}:${Acct}:log-group:aws/spans"
                  - Part: !Ref AWS::Partition
                    Reg: !Ref AWS::Region
                    Acct: !Ref AWS::AccountId
          - Sid: AllowCloudWatchSnsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref Environment

  TelemetryKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/orderflow-telemetry-${Environment}"
      TargetKeyId: !Ref TelemetryKmsKey

  SpansLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: aws/spans
      RetentionInDays: 90
      KmsKeyId: !GetAtt TelemetryKmsKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: transaction-search

  TransactionSearchLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: OrderFlowTransactionSearchAccess
      PolicyDocument: !Sub
        - |-
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "TransactionSearchXRayWrite",
                "Effect": "Allow",
                "Principal": {"Service": "xray.amazonaws.com"},
                "Action": "logs:PutLogEvents",
                "Resource": [
                  "${SpansArn}",
                  "${SignalsArn}"
                ],
                "Condition": {
                  "StringEquals": {"aws:SourceAccount": "${Acct}"},
                  "ArnLike": {"aws:SourceArn": "${XRaySrc}"}
                }
              }
            ]
          }
        - SpansArn: !Sub
            - "arn:${P}:logs:${R}:${A}:log-group:aws/spans:*"
            - P: !Ref AWS::Partition
              R: !Ref AWS::Region
              A: !Ref AWS::AccountId
          SignalsArn: !Sub
            - "arn:${P}:logs:${R}:${A}:log-group:/aws/${S}:*"
            - P: !Ref AWS::Partition
              R: !Ref AWS::Region
              A: !Ref AWS::AccountId
              S: "application-signals/data"
          Acct: !Ref AWS::AccountId
          XRaySrc: !Sub
            - "arn:${P}:xray:${R}:${A}:*"
            - P: !Ref AWS::Partition
              R: !Ref AWS::Region
              A: !Ref AWS::AccountId

  TransactionSearchConfig:
    Type: AWS::XRay::TransactionSearchConfig
    DependsOn:
      - SpansLogGroup
      - TransactionSearchLogPolicy
    Properties:
      IndexingPercentage: !Ref IndexingPercentage

  OrderCheckout5xxMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SpansLogGroup
      FilterPattern: >-
        { $.status.code = "ERROR" || $.httpStatusCode >= 500 }
      MetricTransformations:
        - MetricNamespace: OrderFlow/AWS
          MetricName: OrderCheckout5xxErrors
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  OrderCheckoutLatencyMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SpansLogGroup
      FilterPattern: >-
        { $.spanName = "POST /v1/checkout" && $.durationMs > 0 }
      MetricTransformations:
        - MetricNamespace: OrderFlow/AWS
          MetricName: OrderCheckoutLatencyMs
          MetricValue: "$.durationMs"
          Unit: Milliseconds

  TelemetryAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "orderflow-telemetry-alerts-${Environment}"
      KmsMasterKeyId: !Ref TelemetryKmsKey

  OrderFlowHttp5xxSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "orderflow-checkout-5xx-spike-${Environment}"
      AlarmDescription: >-
        Triggers on OrderFlow HTTP 5xx error spikes in aws/spans.
      Namespace: OrderFlow/AWS
      MetricName: OrderCheckout5xxErrors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref Error5xxThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TelemetryAlertTopic

  OrderFlowCheckoutP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "orderflow-checkout-p95-latency-${Environment}"
      AlarmDescription: >-
        Triggers on checkout p95 latency regression above threshold.
      Namespace: OrderFlow/AWS
      MetricName: OrderCheckoutLatencyMs
      ExtendedStatistic: p95
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref CheckoutP95ThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TelemetryAlertTopic

Outputs:
  SpansLogGroupName:
    Description: Transaction Search log group storing OTLP spans.
    Value: !Ref SpansLogGroup

  Http5xxAlarmArn:
    Description: ARN of HTTP 5xx alarm for FIS StopConditions.
    Value: !GetAtt OrderFlowHttp5xxSpikeAlarm.Arn

  CheckoutP95AlarmArn:
    Description: ARN of checkout p95 latency regression alarm.
    Value: !GetAtt OrderFlowCheckoutP95Alarm.Arn

  AlertTopicArn:
    Description: Encrypted SNS topic for telemetry alarm alerts.
    Value: !Ref TelemetryAlertTopic
