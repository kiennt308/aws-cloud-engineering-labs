# OrderFlow Global - Multi-AZ ALB and Route 53 ARC Zonal Autoshift
# Copyright 2026 Kien Nguyen (Apache-2.0 License)
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ internal Application Load Balancer protected by Route 53
  Application Recovery Controller (ARC) Zonal Autoshift with practice
  runs and observer notifications enabled.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: OrderFlow production VPC ID.
  VpcCidrBlock:
    Type: String
    Default: 10.16.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: VPC CIDR permitted to reach ALB HTTPS port 443.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Three private subnets spanning three Availability Zones.
  PracticeOutcomeAlarmArn:
    Type: String
    AllowedPattern: ^arn:aws:cloudwatch:[a-z0-9-]+:\d{12}:alarm:.+$
    Description: CloudWatch alarm ARN monitoring practice run outcome.
  PracticeBlockingAlarmArn:
    Type: String
    AllowedPattern: ^arn:aws:cloudwatch:[a-z0-9-]+:\d{12}:alarm:.+$
    Description: CloudWatch alarm ARN blocking autoshift practice runs.

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: orderflow-prod-alb-sg
      GroupDescription: Allow HTTPS 443 from OrderFlow VPC CIDR only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidrBlock
          Description: HTTPS traffic from OrderFlow workloads.
      Tags:
        - Key: Name
          Value: orderflow-prod-alb-sg

  OrderFlowAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: orderflow-prod-alb
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: orderflow-prod-alb
        - Key: Environment
          Value: prod

  OrderFlowZonalAutoshift:
    Type: AWS::ARCZonalShift::ZonalAutoshiftConfiguration
    Properties:
      ResourceIdentifier: !Ref OrderFlowAlb
      ZonalAutoshiftStatus: ENABLED
      PracticeRunConfiguration:
        OutcomeAlarms:
          - Type: CLOUDWATCH
            AlarmIdentifier: !Ref PracticeOutcomeAlarmArn
        BlockingAlarms:
          - Type: CLOUDWATCH
            AlarmIdentifier: !Ref PracticeBlockingAlarmArn
        BlockedWindows:
          - Fri:17:00-Fri:21:00

  OrderFlowAutoshiftObserverStatus:
    Type: AWS::ARCZonalShift::AutoshiftObserverNotificationStatus
    Properties:
      Status: ENABLED

Outputs:
  OrderFlowAlbArn:
    Description: ARN of the multi-AZ Application Load Balancer.
    Value: !Ref OrderFlowAlb
  OrderFlowAlbDnsName:
    Description: DNS name of the multi-AZ Application Load Balancer.
    Value: !GetAtt OrderFlowAlb.DNSName
  ZonalAutoshiftStatus:
    Description: Configured ARC Zonal Autoshift status for the ALB.
    Value: ENABLED
