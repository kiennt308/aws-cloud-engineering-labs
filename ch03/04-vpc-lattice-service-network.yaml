AWSTemplateFormatVersion: '2010-09-09'
Description: >
  OrderFlow Global Amazon VPC Lattice service network (orderflow-mesh-sn)
  with IAM AuthPolicy, checkout HTTPS listener, and VPC association.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: OrderFlow VPC ID associated with the service network.
  VpcCidrBlock:
    Type: String
    Default: 10.16.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: VPC IPv4 CIDR permitted to invoke Lattice endpoints.
  OrganizationId:
    Type: String
    Default: o-orderflow01
    AllowedPattern: ^o-[a-z0-9]{10,32}$
    Description: AWS Organizations ID enforced by Lattice AuthPolicy.

Resources:
  LatticeClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: orderflow-lattice-client-sg
      GroupDescription: Allow HTTPS 443 inside OrderFlow VPC CIDR.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidrBlock
          Description: Allow VPC workloads to invoke Lattice services.
      Tags:
        - Key: Name
          Value: orderflow-lattice-client-sg

  OrderFlowServiceNetwork:
    Type: AWS::VpcLattice::ServiceNetwork
    Properties:
      Name: orderflow-mesh-sn
      AuthType: AWS_IAM
      Tags:
        - Key: Platform
          Value: OrderFlow

  CheckoutTargetGroup:
    Type: AWS::VpcLattice::TargetGroup
    Properties:
      Name: orderflow-checkout-tg
      Type: IP
      Config:
        Port: 8443
        Protocol: HTTPS
        ProtocolVersion: HTTP1
        IpAddressType: IPV4
        VpcIdentifier: !Ref VpcId
        HealthCheck:
          Enabled: true
          Protocol: HTTPS
          Path: /healthz
          HealthCheckIntervalSeconds: 15
          HealthCheckTimeoutSeconds: 5
          HealthyThresholdCount: 2
          UnhealthyThresholdCount: 2

  CheckoutService:
    Type: AWS::VpcLattice::Service
    Properties:
      Name: orderflow-checkout-svc
      AuthType: AWS_IAM
      Tags:
        - Key: Service
          Value: checkout

  CheckoutHttpsListener:
    Type: AWS::VpcLattice::Listener
    Properties:
      ServiceIdentifier: !Ref CheckoutService
      Name: https-443
      Port: 443
      Protocol: HTTPS
      DefaultAction:
        Forward:
          TargetGroups:
            - TargetGroupIdentifier: !Ref CheckoutTargetGroup
              Weight: 100

  CheckoutServiceAssociation:
    Type: AWS::VpcLattice::ServiceNetworkServiceAssociation
    Properties:
      ServiceNetworkIdentifier: !Ref OrderFlowServiceNetwork
      ServiceIdentifier: !Ref CheckoutService

  ServiceNetworkAuthPolicy:
    Type: AWS::VpcLattice::AuthPolicy
    Properties:
      ResourceIdentifier: !Ref OrderFlowServiceNetwork
      Policy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAuthenticatedOrderFlowOrgCallers
            Effect: Allow
            Principal: '*'
            Action: 'vpc-lattice-svcs:Invoke'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:PrincipalOrgID': !Ref OrganizationId

  ServiceNetworkVpcAssociation:
    Type: AWS::VpcLattice::ServiceNetworkVpcAssociation
    Properties:
      ServiceNetworkIdentifier: !Ref OrderFlowServiceNetwork
      VpcIdentifier: !Ref VpcId
      SecurityGroupIds:
        - !Ref LatticeClientSecurityGroup

Outputs:
  ServiceNetworkId:
    Description: Amazon VPC Lattice ServiceNetwork ID.
    Value: !Ref OrderFlowServiceNetwork
  CheckoutServiceDnsName:
    Description: Lattice-managed DNS domain name for checkout service.
    Value: !GetAtt CheckoutService.DnsEntry.DomainName
