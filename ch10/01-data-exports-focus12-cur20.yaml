AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  OrderFlow AWS Data Exports deploying FOCUS 1.2 (FOCUS_1_2_AWS)
  and CUR 2.0 (COST_AND_USAGE_REPORT with Split Cost Allocation)
  into a KMS-encrypted S3 export bucket.

Metadata:
  OrderFlowAccount: orderflow-prod
  Author: Kien Nguyen
  License: Apache-2.0

Parameters:
  ExportBucketPrefix:
    Type: String
    Default: orderflow-cur-focus-exports
    Description: S3 bucket prefix matching OrderFlow naming contract.

  FocusTimeGranularity:
    Type: String
    Default: DAILY
    AllowedValues:
      - HOURLY
      - DAILY
      - MONTHLY
    Description: Time granularity for FOCUS_1_2_AWS line items.

Resources:
  FinOpsExportsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: >-
        OrderFlow KMS CMK encrypting FOCUS 1.2 and CUR 2.0 exports.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${Part}:iam::${Acct}:root"
                - Part: !Ref AWS::Partition
                  Acct: !Ref AWS::AccountId
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowBcmDataExportsEncryption
            Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Workload
          Value: finops-data-exports

  FinOpsExportsKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/orderflow-finops-exports
      TargetKeyId: !Ref FinOpsExportsKmsKey

  FinOpsExportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ExportBucketPrefix}-${AWS::AccountId}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt FinOpsExportsKmsKey.Arn
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionAndExpireOldExports
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
            ExpirationInDays: 365

  FinOpsExportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FinOpsExportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTlsTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FinOpsExportsBucket.Arn
              - !Sub "${FinOpsExportsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
          - Sid: AllowBcmDataExportsS3Delivery
            Effect: Allow
            Principal:
              Service: bcm-data-exports.amazonaws.com
            Action:
              - s3:PutObject
              - s3:GetBucketPolicy
            Resource:
              - !GetAtt FinOpsExportsBucket.Arn
              - !Sub "${FinOpsExportsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub
                  - "arn:${Part}:bcm-data-exports:us-east-1:${Acct}:${P}"
                  - Part: !Ref AWS::Partition
                    Acct: !Ref AWS::AccountId
                    P: "export/*"

  OrderFlowFocus12Export:
    Type: AWS::BCMDataExports::Export
    DependsOn: FinOpsExportsBucketPolicy
    Properties:
      Export:
        Name: orderflow-focus-1-2-export
        Description: >-
          OrderFlow FOCUS 1.2 export with InvoiceId and Capacity
          Reservation tracking for cross-cloud FinOps analytics.
        DataQuery:
          QueryStatement: >-
            SELECT BillingPeriodStart, BillingPeriodEnd,
            ChargePeriodStart, ChargePeriodEnd, InvoiceId,
            BillingAccountId, SubAccountId, SubAccountName, RegionId,
            ServiceName, ChargeCategory, PricingCategory, ResourceId,
            ConsumedQuantity, ConsumedUnit, ListCost, EffectiveCost,
            BilledCost, CapacityReservationId,
            CapacityReservationStatus, Tags, x_Discounts, x_Operation,
            x_ServiceCode FROM FOCUS_1_2_AWS
          TableConfigurations:
            FOCUS_1_2_AWS:
              TIME_GRANULARITY: !Ref FocusTimeGranularity
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref FinOpsExportsBucket
            S3Region: !Ref AWS::Region
            S3Prefix: focus-1-2/
            S3OutputConfigurations:
              Compression: PARQUET
              Format: PARQUET
              OutputType: CUSTOM
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS

  OrderFlowCur20Export:
    Type: AWS::BCMDataExports::Export
    DependsOn: FinOpsExportsBucketPolicy
    Properties:
      Export:
        Name: orderflow-cur-2-0-export
        Description: >-
          OrderFlow CUR 2.0 hourly export with Split Cost Allocation
          for EKS/ECS container unit-cost attribution.
        DataQuery:
          QueryStatement: >-
            SELECT identity_line_item_id, identity_time_interval,
            bill_invoice_id, line_item_usage_account_id,
            line_item_line_item_type, line_item_product_code,
            line_item_usage_type, line_item_operation,
            line_item_resource_id, line_item_usage_amount,
            line_item_unblended_cost, line_item_net_unblended_cost,
            line_item_amortized_cost, line_item_net_amortized_cost,
            split_line_item_parent_resource_id,
            split_line_item_split_usage, split_line_item_split_cost,
            split_line_item_net_split_cost, resource_tags
            FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              TIME_GRANULARITY: HOURLY
              INCLUDE_RESOURCES: "TRUE"
              INCLUDE_SPLIT_COST_ALLOCATION_DATA: "TRUE"
              INCLUDE_MANUAL_DISCOUNT_COMPATIBILITY: "FALSE"
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref FinOpsExportsBucket
            S3Region: !Ref AWS::Region
            S3Prefix: cur-2-0/
            S3OutputConfigurations:
              Compression: PARQUET
              Format: PARQUET
              OutputType: CUSTOM
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS

Outputs:
  ExportsBucketName:
    Description: Encrypted S3 bucket receiving Data Exports.
    Value: !Ref FinOpsExportsBucket

  Focus12ExportArn:
    Description: ARN of the FOCUS 1.2 (FOCUS_1_2_AWS) Data Export.
    Value: !GetAtt OrderFlowFocus12Export.ExportArn

  Cur20ExportArn:
    Description: ARN of the CUR 2.0 Split Cost Allocation Data Export.
    Value: !GetAtt OrderFlowCur20Export.ExportArn
